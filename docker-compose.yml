services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-reposage}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-reposage}
      POSTGRES_DB: ${POSTGRES_DB:-reposage}
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-reposage}"]
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7-alpine
  qdrant:
    image: qdrant/qdrant:v1.13.4
    volumes: [qdrant_data:/qdrant/storage]
  api:
    build: ./backend
    env_file: .env
    volumes:
      - ./backend:/app
    ports: ["8000:8000"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      qdrant:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
  worker:
    build: ./backend
    command: celery -A app.worker.celery_app worker --loglevel=INFO
    volumes:
      - ./backend:/app
    env_file: .env
    depends_on:
      api:
        condition: service_healthy
      redis:
        condition: service_started
  web:
    build: ./frontend
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000/api/v1}
    ports: ["3000:3000"]
    depends_on:
      api:
        condition: service_healthy
volumes:
  postgres_data:
  qdrant_data:
